name: erpnext
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

x-erpnext-image: &erpnext-image
  image: frappe/erpnext:latest
  pull_policy: always

services:
  frontend:
    <<: *erpnext-image
    container_name: erpnext-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    logging: *default-logging
    command:
      - nginx-entrypoint.sh
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: erpnext-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: ${BASE_HOST_NAME:-$HOSTNAME}
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: 'off'
      PROXY_READ_TIMEOUT: '120'
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - './volumes/data/erpnext/sites:/home/frappe/frappe-bench/sites'
      - './volumes/data/erpnext/logs:/home/frappe/frappe-bench/logs'
    depends_on:
      - websocket
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080']
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://erpnext-app:8080'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - erpnext
      - cloudflare

  backend:
    <<: *erpnext-image
    container_name: erpnext-backend
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: erpnext-backend
      DB_HOST: db
      DB_PORT: '3306'
      MYSQL_ROOT_PASSWORD: ${DB_ADMIN_PASS:-replace-with-a-random-password}
      MARIADB_ROOT_PASSWORD: ${DB_ADMIN_PASS:-replace-with-a-random-password}
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:8000/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/data/erpnext/sites:/home/frappe/frappe-bench/sites'
      - './volumes/data/erpnext/logs:/home/frappe/frappe-bench/logs'
    depends_on:
      - db
      - redis-cache
      - redis-queue
    networks:
      - erpnext

  configurator:
    <<: *erpnext-image
    container_name: erpnext-configurator
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: 'no'
    logging: *default-logging
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: erpnext-configurator
      DB_HOST: db
      DB_PORT: '3306'
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: '9000'
    volumes:
      - './volumes/data/erpnext/sites:/home/frappe/frappe-bench/sites'
      - './volumes/data/erpnext/logs:/home/frappe/frappe-bench/logs'
    depends_on:
      - db
      - redis-cache
      - redis-queue
    networks:
      - erpnext

  create-site:
    <<: *erpnext-image
    container_name: erpnext-create-site
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: 'no'
    logging: *default-logging
    entrypoint:
      - bash
      - -c
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] &&
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] &&
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1
          fi
        done;
        bench new-site --mariadb-user-host-login-scope='%'
          --admin-password=${DB_ADMIN_PASS:-replace-with-a-random-password}
          --db-root-username=root
          --db-root-password=${DB_ADMIN_PASS:-replace-with-a-random-password}
          --install-app erpnext
          --set-default ${BASE_HOST_NAME:-$HOSTNAME};
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: erpnext-create-site
      DB_ADMIN_PASS: ${DB_ADMIN_PASS:-replace-with-a-random-password}
    volumes:
      - './volumes/data/erpnext/sites:/home/frappe/frappe-bench/sites'
      - './volumes/data/erpnext/logs:/home/frappe/frappe-bench/logs'
    depends_on:
      - db
      - configurator
    networks:
      - erpnext

  websocket:
    <<: *erpnext-image
    container_name: erpnext-websocket
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    logging: *default-logging
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: erpnext-websocket
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/9000']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/data/erpnext/sites:/home/frappe/frappe-bench/sites'
      - './volumes/data/erpnext/logs:/home/frappe/frappe-bench/logs'
    depends_on:
      - redis-cache
      - redis-queue
    networks:
      - erpnext

  queue-long:
    <<: *erpnext-image
    container_name: erpnext-queue-long
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    logging: *default-logging
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: erpnext-queue-long
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    volumes:
      - './volumes/data/erpnext/sites:/home/frappe/frappe-bench/sites'
      - './volumes/data/erpnext/logs:/home/frappe/frappe-bench/logs'
    depends_on:
      - redis-queue
    networks:
      - erpnext

  queue-short:
    <<: *erpnext-image
    container_name: erpnext-queue-short
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    logging: *default-logging
    command:
      - bench
      - worker
      - --queue
      - short,default
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: erpnext-queue-short
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    volumes:
      - './volumes/data/erpnext/sites:/home/frappe/frappe-bench/sites'
      - './volumes/data/erpnext/logs:/home/frappe/frappe-bench/logs'
    depends_on:
      - redis-queue
    networks:
      - erpnext

  scheduler:
    <<: *erpnext-image
    container_name: erpnext-scheduler
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    logging: *default-logging
    command:
      - bench
      - schedule
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: erpnext-scheduler
    volumes:
      - './volumes/data/erpnext/sites:/home/frappe/frappe-bench/sites'
      - './volumes/data/erpnext/logs:/home/frappe/frappe-bench/logs'
    depends_on:
      - db
      - redis-queue
    networks:
      - erpnext

  db:
    image: mariadb:latest
    container_name: erpnext-db
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: erpnext-db
    restart: always
    pull_policy: always
    logging: *default-logging
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: erpnext-db
      MYSQL_ROOT_PASSWORD: ${DB_ADMIN_PASS:-replace-with-a-random-password}
      MARIADB_ROOT_PASSWORD: ${DB_ADMIN_PASS:-replace-with-a-random-password}
    volumes:
      - './volumes/db/mariadb/erpnext:/var/lib/mysql:z'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erpnext

  redis-cache:
    image: redis:alpine
    container_name: erpnext-redis-cache
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: erpnext-redis-cache
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: erpnext-redis-cache
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - erpnext

  redis-queue:
    image: redis:alpine
    container_name: erpnext-redis-queue
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: erpnext-redis-queue
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: erpnext-redis-queue
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/data/redis/erpnext-queue:/data:z'
    networks:
      - erpnext

networks:
  erpnext:
    name: erpnext
    external: false
  cloudflare:
    external: true
