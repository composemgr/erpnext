# nginx proxy address - http://172.17.0.1:8070

name: erpnext
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  erpnext:
    image: frappe/erpnext:latest
    pull_policy: always
    container_name: erpnext-app
    restart: always
    logging: *default-logging
    networks:
      - erpnext
    ports:
      - "172.17.0.1:8070:8000"
    environment:
      TZ: ${TZ:-America/New_York}
      FRAPPE_SITE_NAME_HEADER: ${BASE_HOST_NAME:-localhost}
      DB_HOST: erpnext-db
      DB_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ADMIN_PASS:-changeme_admin_password}
    volumes:
      - ./volumes/data/erpnext/sites:/home/frappe/frappe-bench/sites
      - ./volumes/data/erpnext/logs:/home/frappe/frappe-bench/logs
    depends_on:
      - erpnext-db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3

  erpnext-db:
    image: mariadb:latest
    pull_policy: always
    container_name: erpnext-db
    restart: always
    logging: *default-logging
    networks:
      - erpnext
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --skip-character-set-client-handshake --skip-innodb-read-only-compressed
    environment:
      TZ: ${TZ:-America/New_York}
      MARIADB_DATABASE: ${DB_CREATE_DATABASE_NAME:-erpnext}
      MARIADB_USER: ${DB_USER_NAME:-erpnext}
      MARIADB_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      MARIADB_ROOT_PASSWORD: ${DB_ADMIN_PASS:-changeme_admin_password}
    volumes:
      - ./volumes/data/db/mariadb/erpnext:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  erpnext:
    name: erpnext
    external: false
